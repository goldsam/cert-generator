name: Build, Test and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  # Local tag the test suites run against.
  TEST_IMAGE: cert-generator:test

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install the cosign tool except on PR
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false disables the action's own handling of `latest`, so the
          # raw rule below is the only thing that can move it.
          flavor: |
            latest=false
          # Tags produced, in the order listed below:
          #   latest          moving pointer at the tip of the default branch
          #   sha-51a4ec1     immutable per-commit reference, every build
          # Comments are deliberately kept out of the block below: its contents
          # are passed to the action verbatim, not read as YAML.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Build once, into the local daemon, carrying both the release tags and a
      # fixed local tag for the tests. Nothing is pushed yet: the image has to
      # earn that by passing the suites below.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.TEST_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: ./test/run-tests.sh "${TEST_IMAGE}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the very image that was just tested, rather than rebuilding it, so
      # the published artifact is the one the suites actually exercised.
      - name: Push image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        id: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Pushing $tag"
            output="$(docker push "$tag")"
            echo "$output"
            digest="$(printf '%s\n' "$output" \
              | sed -n 's/.*\(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
          done <<< "$TAGS"
          if [ -z "$digest" ]; then
            echo "Could not determine the pushed image digest." >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
